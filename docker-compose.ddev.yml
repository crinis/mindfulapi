# Compose override for DDEV / TYPO3 integration.
#
# Attaches the playwright and mindfulapi services to the external `ddev_default`
# network so the API can scan pages served at *.ddev.site addresses, and exempts
# those (private) hostnames from the SSRF block.
#
# Unlike a plain docker-compose.override.yml (auto-loaded by `docker compose`),
# this file must be requested explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.ddev.yml up -d
#
# Or set COMPOSE_FILE so plain `docker compose` picks both files up:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.ddev.yml

services:
  playwright:
    networks:
      - default
      - ddev_default

  mindfulapi:
    networks:
      - default
      - ddev_default
    environment:
      # DDEV targets (*.ddev.site) resolve to private addresses, which the SSRF
      # policy blocks by default. Exempt only the named host(s) via the
      # allowlist — this keeps the per-request browser guard active for every
      # other address, rather than opening all private ranges with
      # SCAN_ALLOW_PRIVATE_TARGETS=true.
      - SCAN_TARGET_ALLOW_HOSTS=${SCAN_TARGET_ALLOW_HOSTS:-}

networks:
  ddev_default:
    external: true
    name: ddev_default
