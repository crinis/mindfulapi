services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  playwright:
    # IMPORTANT: keep this image version and the playwright@x.y.z in the
    # command below in sync with the "playwright" dependency in package.json.
    # A version mismatch will lead to failures.
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - "npx -y playwright@1.60.0 run-server --port 3000 --host 0.0.0.0"
    healthcheck:
      # The Playwright server accepts WebSocket upgrades; a plain HTTP request
      # returns 400 (not 200), which is enough to confirm it is alive.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mindfulapi:
    image: ${MINDFULAPI_IMAGE:-ghcr.io/crinis/mindfulapi:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Published on the loopback interface only, for a reverse proxy on the
      # same host. Docker's published ports bypass host firewalls such as ufw,
      # so BIND_ADDRESS=0.0.0.0 (all interfaces) exposes the API publicly over
      # plain HTTP; set it only when that is what you want.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    # Every variable in .env reaches the container (SCAN_CONCURRENCY, CORS_ORIGINS,
    # THROTTLE_*, AGENT_*, ...). The `environment:` entries below take precedence
    # over env_file, so the service wiring (NODE_ENV, DATABASE_PATH,
    # PLAYWRIGHT_WS_URL, REDIS_*, PORT) stays pinned even when .env holds
    # local-development values. The entries with a `${VAR:-default}` repeat the
    # application default; for those, a variable set in the shell that runs
    # docker compose overrides .env.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/database.sqlite
      - PLAYWRIGHT_WS_URL=ws://playwright:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # The bundled redis service runs without a password.
      - REDIS_PASSWORD=
      - PORT=3000
      # Required: compose refuses to start while AUTH_TOKEN is undefined, and
      # the API itself refuses to start with an empty token. To run without
      # authentication (not recommended), set AUTH_TOKEN= (empty) together with
      # AUTH_DISABLED=true in .env.
      - AUTH_TOKEN=${AUTH_TOKEN?AUTH_TOKEN must be set in .env (or AUTH_TOKEN= with AUTH_DISABLED=true)}
      - IGNORE_HTTPS_ERRORS=${IGNORE_HTTPS_ERRORS:-false}
      - CLEANUP_ENABLED=${CLEANUP_ENABLED:-true}
      - CLEANUP_RETENTION_DAYS=${CLEANUP_RETENTION_DAYS:-30}
      - CLEANUP_INTERVAL=${CLEANUP_INTERVAL:-0 2 * * *}
      - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY:-4}
      # Optional AI accessibility audit (disabled by default). See README.
      # Element screenshots and page text (headings, links, form labels, title)
      # are sent to the configured provider. AGENT_PROVIDER, AGENT_MODEL,
      # AGENT_API_KEY, AGENT_SKILLS etc. come from .env through env_file.
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - AGENT_ALLOWED_SCAN_MODES=${AGENT_ALLOWED_SCAN_MODES:-single_url}
    volumes:
      - mindfulapi_data:/data
    depends_on:
      redis:
        condition: service_healthy
      playwright:
        condition: service_healthy
    restart: unless-stopped
    # Give in-flight scans time to finish before SIGKILL on shutdown.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
    driver: local
  mindfulapi_data:
    driver: local
