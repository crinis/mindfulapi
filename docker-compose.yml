services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  playwright:
    # IMPORTANT: keep this image version and the playwright@x.y.z in the
    # command below in sync with the "playwright" dependency in package.json.
    # A version mismatch will lead to failures.
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - "npx -y playwright@1.60.0 run-server --port 3000 --host 0.0.0.0"
    healthcheck:
      # The Playwright server accepts WebSocket upgrades; a plain HTTP request
      # returns 400 (not 200), which is enough to confirm it is alive.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mindfulapi:
    image: ghcr.io/crinis/mindfulapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/database.sqlite
      - PLAYWRIGHT_WS_URL=ws://playwright:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - AUTH_TOKEN=${AUTH_TOKEN:-changeme}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - IGNORE_HTTPS_ERRORS=${IGNORE_HTTPS_ERRORS:-false}
      - CLEANUP_ENABLED=${CLEANUP_ENABLED:-true}
      - CLEANUP_RETENTION_DAYS=${CLEANUP_RETENTION_DAYS:-30}
      - CLEANUP_INTERVAL=${CLEANUP_INTERVAL:-0 2 * * *}
      - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY:-4}
      # Optional AI accessibility audit (disabled by default). See README.
      # Element screenshots + attributes are sent to the configured provider.
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - AGENT_PROVIDER=${AGENT_PROVIDER:-}
      - AGENT_MODEL=${AGENT_MODEL:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_BASE_URL=${AGENT_BASE_URL:-}
      - AGENT_SKILLS=${AGENT_SKILLS:-image_alt_text}
    volumes:
      - mindfulapi_data:/data
    depends_on:
      redis:
        condition: service_healthy
      playwright:
        condition: service_healthy
    restart: unless-stopped
    # Give in-flight scans time to finish before SIGKILL on shutdown.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
    driver: local
  mindfulapi_data:
    driver: local
